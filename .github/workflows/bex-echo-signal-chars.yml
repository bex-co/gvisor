# bex (github.com/bex-co/bex, w4/m545): builds runsc and the containerd shim
# from this branch, runs the devpts unit test and the PTY syscall tests
# natively and on runsc, proves the new tests fail without the line
# discipline fix, and runs bex's PTY probe natively, on the stock release and
# on the patched runsc.
name: bex echo signal characters

"on":
  push:
    branches:
      - "bex/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  # The stock release bex's sandbox pool ran before this fix, and its digest
  # as pinned in bex's infra/clusterapi/overlays/hetzner-caph/sandbox-pool.yaml.
  STOCK_URL: https://storage.googleapis.com/gvisor/releases/release/20260622.0/x86_64/runsc
  STOCK_SHA512: 6df95d09363dbd9ee5d5c889c1549b457e1783b039ff60a8f9f16f8c94c774a2ca2eef5b1c370e36b863f6b0407b53ba3c69051c6ef051253843dabf89a6de4e

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build runsc and containerd-shim-runsc-v1
        run: |
          mkdir -p bin
          make copy TARGETS=runsc DESTINATION=bin/
          make copy TARGETS=//shim:containerd-shim-runsc-v1 DESTINATION=bin/
          cd bin
          ./runsc --version
          sha512sum runsc containerd-shim-runsc-v1 | tee SHA512SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: runsc-x86_64
          path: bin/

  unit-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: make test TARGETS=//pkg/sentry/fsimpl/devpts:devpts_test OPTIONS=--test_output=errors

  syscall-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Ubuntu 24.04 denies unprivileged user namespaces through AppArmor,
      # which the rootless runsc of the syscall test runner needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The default platform's variant is systrap with directfs, as runsc
      # runs by default (test/runner/defs.bzl). Natively, only the new tests
      # run: they check what Linux does; the others are upstream's.
      - name: pty_test on runsc
        run: make syscall-tests TARGETS=//test/syscalls:pty_test_runsc_systrap_directfs OPTIONS=--test_output=errors
      - name: The new pty tests on native Linux
        run: make syscall-tests TARGETS=//test/syscalls:pty_test_native OPTIONS="--test_output=errors --test_filter=*SignalChar*:*ControlChar*:*NoncanonNewline*:*FlowControlChars*"

  syscall-tests-without-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 10
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Revert the line discipline fix, keep its tests
        run: |
          fix=$(git log --format=%H -1 --grep='^devpts: Echo signal characters')
          git checkout "$fix~1" -- pkg/sentry/fsimpl/devpts/line_discipline.go
          git diff --stat HEAD
      - name: The new tests must fail on runsc without the fix
        run: |
          set +e
          make syscall-tests TARGETS=//test/syscalls:pty_test_runsc_systrap_directfs \
            OPTIONS="--test_output=errors --test_filter=*SignalChar*:*ControlChar*:*NoncanonNewline*:*FlowControlChars*" >out.txt 2>&1
          status=$?
          set -e
          cat out.txt
          test "$status" -ne 0
          # A build or runner error must not pass for a test failure: the
          # failures are the new tests'.
          grep -E '\[  FAILED  \] (PtyTest|JobControlTest)\.(SignalChar|ControlChar|NoncanonNewline|FlowControlChars)' out.txt >failed.txt
          sort -u failed.txt

  probe:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: runsc-x86_64
          path: patched
      - name: Fetch the stock runsc
        run: |
          mkdir -p stock
          curl -fsSL -o stock/runsc "$STOCK_URL"
          echo "$STOCK_SHA512  stock/runsc" | sha512sum -c -
          chmod a+rx stock/runsc patched/runsc
      - name: Native Linux
        run: python3 -I .github/bex/pty-signal-echo-probe.py
      - name: Stock runsc (expected to differ)
        run: |
          if sudo stock/runsc --network=none do python3 -I "$PWD/.github/bex/pty-signal-echo-probe.py"; then
            echo "::error::the stock runsc already echoes signal characters"
            exit 1
          fi
      - name: Patched runsc
        run: sudo patched/runsc --network=none do python3 -I "$PWD/.github/bex/pty-signal-echo-probe.py"
