# bex (w4/m545): runs bex's PTY probe under a published runsc build, without
# building one. Push the branch with BEX_RUNSC_URL / BEX_RUNSC_SHA512 set in
# .github/bex/probe.env, or dispatch with inputs.
name: bex probe a runsc build

"on":
  push:
    branches:
      - bex-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Fetch the runsc under test
        run: |
          . .github/bex/probe.env
          # The checkout already has a runsc/ directory.
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -fsSL -o runsc "$BEX_RUNSC_URL"
          echo "$BEX_RUNSC_SHA512  runsc" | sha512sum -c -
          chmod a+rx runsc
          ./runsc --version
      - name: Native Linux
        run: python3 -I .github/bex/pty-signal-echo-probe.py
      - name: The runsc under test, five times
        run: |
          for i in 1 2 3 4 5; do
            sudo "$RUNNER_TEMP/bin/runsc" --network=none do python3 -I "$PWD/.github/bex/pty-signal-echo-probe.py"
          done

  # bex's own check (scripts/sandbox-runsc-pty-check.sh) must fail on the
  # sandbox pool's stock pin and pass on the patched one.
  bex-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Stock pin (expected to fail)
        run: |
          if bash .github/bex/check/scripts/sandbox-runsc-pty-check.sh .github/bex/check/stock-sandbox-pool.yaml; then
            echo "::error::bex's check passed on the stock runsc"
            exit 1
          fi
      - name: Patched pin
        run: bash .github/bex/check/scripts/sandbox-runsc-pty-check.sh .github/bex/check/patched-sandbox-pool.yaml
